plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.144' }
group = 'org.scex'
version = '1.0.0'
base { archivesName = 'scex-tag-exporter-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
neoForge { version = '21.1.248'; mods { scex_tag_exporter { sourceSet sourceSets.main } } }
dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.named('jar', Jar) { from(project.files('LICENSE', 'NOTICE.md')) { into 'META-INF' } }
tasks.register('writerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.scex.tagexporter.export.XlsxExporterTest'
    maxHeapSize = '512m'
}
tasks.named('check') { dependsOn writerTest }
